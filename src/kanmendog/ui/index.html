<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看门狗 KanmenDog</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --fg:#e6ecf5; --muted:#8b97ad; --acc:#3b82f6; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid #232c40; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .v { color:var(--muted); font-size:12px; }
  .wrap { padding:18px 22px; max-width:980px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid #232c40; border-radius:10px; padding:14px; }
  .stat .k { color:var(--muted); font-size:12px; }
  .stat .val { font-size:20px; font-weight:600; margin-top:4px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.on { background:rgba(34,197,94,.15); color:var(--ok); }
  .pill.off { background:rgba(239,68,68,.15); color:var(--bad); }
  .card { background:var(--card); border:1px solid #232c40; border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  label { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px dashed #232c40; }
  label:last-child { border-bottom:none; }
  label span { color:var(--muted); }
  input[type=number], input[type=text] { width:160px; background:#0f1420; border:1px solid #2c3650; color:var(--fg); border-radius:7px; padding:6px 9px; }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--acc); }
  .switch { position:relative; width:46px; height:26px; flex:0 0 auto; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#3a445c; border-radius:999px; transition:.2s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--ok); }
  .switch input:checked + .slider:before { transform:translateX(20px); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:#2c3650; }
  button.danger { background:var(--bad); }
  button:active { transform:translateY(1px); }
  pre { background:#0b0f18; border:1px solid #232c40; border-radius:8px; padding:12px; max-height:320px; overflow:auto; white-space:pre-wrap; word-break:break-all; color:#b8c4da; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2c3650; padding:10px 18px; border-radius:8px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🐕 看门狗 KanmenDog</h1>
  <span class="v" id="ver"></span>
</header>
<div class="wrap">
  <div class="grid" id="stats"></div>

  <div class="card">
    <h2>监控开关</h2>
    <div class="row">
      <label class="switch" style="border:none;padding:0;">
        <input type="checkbox" id="enabledSw">
        <span class="slider"></span>
      </label>
      <span id="enabledTxt" class="muted"></span>
      <button class="ghost" onclick="refresh()">刷新状态</button>
    </div>
    <p class="muted">关闭后看门狗被解除，系统不会自动重启（Web 仍可访问以重新开启）。</p>
  </div>

  <div class="card">
    <h2>参数配置</h2>
    <label><span>健康检查/喂狗周期（秒）</span><input type="number" id="interval_sec" min="2" max="300"></label>
    <label><span>看门狗硬件超时（秒）</span><input type="number" id="watchdog_timeout_sec" min="5" max="600"></label>
    <label><span>连续失败多少次判定死机</span><input type="number" id="fail_threshold" min="1" max="20"></label>
    <label><span>Web 服务端口</span><input type="number" id="port" min="1" max="65535"></label>
    <label><span>判定死机后自动重启</span><input type="checkbox" id="auto_reboot"></label>
    <hr style="border-color:#232c40">
    <label><span>fork 存活测试</span><input type="checkbox" id="check_fork"></label>
    <label><span>系统负载测试</span><input type="checkbox" id="check_load"></label>
    <label><span>1 分钟负载阈值</span><input type="number" id="load_threshold" step="0.1" min="0"></label>
    <label><span>D状态进程数测试</span><input type="checkbox" id="check_dstate"></label>
    <label><span>D状态进程数阈值</span><input type="number" id="dstate_threshold" min="0" max="500"></label>
    <label><span>外部命令探针</span><input type="checkbox" id="check_service_probe"></label>
    <label><span>探针命令（返回0即通过）</span><input type="text" id="service_probe_cmd" style="width:280px"></label>
    <div class="btns"><button onclick="saveConfig()">保存配置</button><span class="muted">保存即时生效；部分项需重启服务</span></div>
  </div>

  <div class="card">
    <h2>运行日志</h2>
    <div class="btns" style="margin-bottom:10px;">
      <button class="ghost" onclick="loadLogs()">刷新</button>
      <span class="muted">最近重启原因会写入日志顶部，便于排查</span>
    </div>
    <pre id="logs">加载中…</pre>
  </div>

  <div class="card">
    <h2>服务控制</h2>
    <div class="btns">
      <button onclick="svc('start')">启动服务</button>
      <button class="ghost" onclick="svc('stop')">停止服务</button>
      <button class="ghost" onclick="svc('restart')">重启服务</button>
    </div>
    <p class="muted">停止服务会关闭整个进程（含本页面），需到飞牛应用中心重新开启。</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

async function refresh(){
  const s = await (await fetch('/api/status')).json();
  $('ver').textContent = 'v'+s.version;
  const pill = on => `<span class="pill ${on?'on':'off'}">${on?'运行中':'已停止'}</span>`;
  const wd = s.watchdog_open ? '<span class="pill on">已开启</span>' : '<span class="pill off">未开启</span>';
  $('stats').innerHTML = `
    <div class="stat"><div class="k">监控状态</div><div class="val">${pill(s.enabled)}</div></div>
    <div class="stat"><div class="k">看门狗 ${s.watchdog_device}</div><div class="val">${wd}</div></div>
    <div class="stat"><div class="k">当前负载(1m)</div><div class="val">${s.current_load}</div></div>
    <div class="stat"><div class="k">D状态进程</div><div class="val">${s.dstate_count}</div></div>
    <div class="stat"><div class="k">连续失败</div><div class="val">${s.consecutive_fails}/${'/'}</div></div>
    <div class="stat"><div class="k">进程 PID</div><div class="val">${s.pid}</div></div>`;
  $('enabledSw').checked = s.enabled;
  $('enabledTxt').textContent = s.enabled ? '监控进行中，检测到死机将自动重启' : '监控已暂停';
  if (s.last_reboot_reason) $('stats').insertAdjacentHTML('beforeend',
    `<div class="stat"><div class="k">上次重启原因</div><div class="val" style="font-size:13px">${esc(s.last_reboot_reason.split('\n')[1]||s.last_reboot_reason)}</div></div>`);
  const c = await (await fetch('/api/config')).json();
  for (const k of ['interval_sec','watchdog_timeout_sec','fail_threshold','port','load_threshold','dstate_threshold'])
    $(k).value = c[k];
  for (const k of ['auto_reboot','check_fork','check_load','check_dstate','check_service_probe'])
    $(k).checked = c[k];
  $('service_probe_cmd').value = c.service_probe_cmd || '';
}
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

async function saveConfig(){
  const c = {};
  for (const k of ['interval_sec','watchdog_timeout_sec','fail_threshold','port','load_threshold','dstate_threshold'])
    c[k] = Number($(k).value);
  for (const k of ['auto_reboot','check_fork','check_load','check_dstate','check_service_probe'])
    c[k] = $(k).checked;
  c.service_probe_cmd = $('service_probe_cmd').value;
  c.enabled = $('enabledSw').checked;
  const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});
  toast(r.ok ? '配置已保存' : '保存失败');
  refresh();
}
async function loadLogs(){
  const r = await fetch('/api/logs?lines=300');
  $('logs').textContent = await r.text();
}
$('enabledSw').addEventListener('change', async e=>{
  const r = await fetch('/api/toggle?enabled='+(e.target.checked?1:0),{method:'POST'});
  toast(r.ok ? (e.target.checked?'监控已开启':'监控已暂停') : '操作失败');
  refresh();
});
async function svc(a){
  const r = await fetch('/api/service?action='+a,{method:'POST'});
  const j = await r.json();
  toast((j.error? '错误: '+j.error : a+' 完成') + (j.output? ' ('+j.output+')':''));
}
refresh(); loadLogs();
setInterval(()=>{ refresh(); }, 15000);
</script>
</body>
</html>
